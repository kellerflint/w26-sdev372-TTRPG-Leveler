services:
  # MySQL service
  mysql:
    image: mysql:8.4
    container_name: my_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # Node.js API service
  backend:
    container_name: my_backend
    build:
      context: ./backend
    working_dir: /usr/src/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_PORT: ${DB_PORT}
      INTERNAL_PORT: ${INTERNAL_PORT}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${BACKEND_PORT}:${INTERNAL_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  # Nginx
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: my_nginx
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Database Seeder
  db-seeder:
    image: mysql:8.4
    container_name: my_db_seeder
    volumes:
      - ./database:/scripts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: >
      sh -c "mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD} -e \"CREATE DATABASE IF NOT EXISTS ttrpg_test_db;\" && \
      if [ -z \"$$(mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD} -D $${MYSQL_DATABASE} -N -s -e 'SELECT id FROM class_reference LIMIT 1;' 2>/dev/null)\" ]; then \
        echo 'Seeding database...'; \
        mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD} $${MYSQL_DATABASE} < /scripts/init_and_seed.sql; \
      else \
        echo 'Database already seeded, skipping...'; \
      fi"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./cypress:/app/cypress
      - ./frontend/test:/app/frontend/test
      - ./backend/tests:/app/backend/tests
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ttrpg_test_db
      CYPRESS_baseUrl: http://nginx
      VITE_API_BASE_URL: http://nginx/api
      NODE_ENV: test
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      nginx:
        condition: service_started
    networks:
      - app-network
    command: >
      sh -c "npx cypress run && cd frontend && npm test && cd ../backend && npm test"

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
